<script>
const quizData = [
            {
                unit: 1, title: "Tabungan Mingguan Raka", context: "Pribadi",
                stimulus: "Raka, siswa kelas XI di Pontianak, menabung uang jajan setiap minggu. Setoran minggu pertama sebesar Rp20.000, dan setoran setiap minggu berikutnya selalu Rp5.000 lebih besar daripada setoran minggu sebelumnya. Orang tua Raka menyarankan agar kenaikan setoran dihentikan begitu setoran mingguan mencapai Rp100.000.",
                questions: [
                    { id: '1a', type: 'isian', text: "Berapa rupiah setoran Raka pada minggu ke-12?", maxScore: 1, key: "75000", rubric: "Jawaban akhir 75000 atau Rp75.000." },
                    { id: '1b', type: 'uraian', text: "Pada minggu ke berapa setoran Raka mencapai batas Rp100.000? Tuliskan model matematika yang kamu gunakan.", maxScore: 3, key: "Minggu ke-17", rubric: "Kredit Penuh (3): Model U_n = 15.000 + 5.000n, hitungan n=17, kesimpulan konteks benar. Kredit Sebagian (2): Model & hitungan benar, tanpa kesimpulan konteks. Kredit Sebagian (1): Hanya model U_n yang benar." }
                ]
            },
            {
                unit: 2, title: "Dua Tawaran Kerja", context: "Pekerjaan",
                stimulus: "Dinda menerima dua tawaran kerja dari perusahaan pengolahan kopi. Perusahaan A: Gaji pokok Rp3.200.000/bulan tahun pertama, kenaikan tetap Rp150.000/tahun. Perusahaan B: Gaji pokok Rp3.000.000/bulan tahun pertama, kenaikan tetap Rp250.000/tahun. Dinda berencana bekerja selama 6 tahun.",
                questions: [
                    { id: '2a', type: 'uraian', text: "Tuliskan model gaji pokok bulanan pada tahun ke-n untuk masing-masing perusahaan.", maxScore: 1, key: "A_n = 3.200.000 + (n-1)150.000; B_n = 3.000.000 + (n-1)250.000", rubric: "Kredit Penuh (1): Kedua model benar." },
                    { id: '2b', type: 'pgs', text: "Mulai tahun ke berapa gaji pokok bulanan di Perusahaan B lebih tinggi daripada di Perusahaan A?", options: ["A. Tahun ke-2", "B. Tahun ke-3", "C. Tahun ke-4", "D. Tahun ke-5"], maxScore: 1, key: "C" },
                    { id: '2c', type: 'uraian', text: "Dengan rencana bekerja selama 6 tahun, tawaran manakah yang sebaiknya dipilih Dinda? Berikan alasan berdasarkan perbandingan gaji.", maxScore: 2, key: "Perusahaan B", rubric: "Kredit Penuh (2): Memilih B dengan alasan total gaji 6 tahun lebih besar (Perusahaan A Rp21.450.000; Perusahaan B Rp21.750.000; selisih Rp300.000). Kredit Sebagian (1): Memilih B hanya karena kenaikan tahunan lebih besar tanpa menghitung total 6 tahun." }
                ]
            },
            {
                unit: 3, title: "Persediaan Beras di Posko Banjir", context: "Masyarakat",
                stimulus: "Setelah banjir di tepi Sungai Kapuas, posko menyimpan 960 kg beras. Setiap hari disalurkan 24 kg. Batas aman: persediaan pada akhir hari tidak boleh kurang dari 120 kg.",
                questions: [
                    { id: '3a', type: 'uraian', text: "Tuliskan model persediaan beras pada akhir hari ke-n, lalu tentukan persediaan akhir hari ke-10.", maxScore: 2, key: "U_n = 960 - 24n. Hari ke-10 = 720 kg.", rubric: "Kredit Penuh (2): Model dan perhitungan benar. Kredit Sebagian (1): Hanya model benar ATAU hanya hasil akhir 720 benar." },
                    { id: '3b', type: 'uraian', text: "Pada akhir hari ke berapa persediaan untuk pertama kalinya kurang dari batas aman? Jelaskan mengapa akhir hari ke-35 belum termasuk.", maxScore: 2, key: "Hari ke-36", rubric: "Kredit Penuh (2): Menjawab hari ke-36 dan menjelaskan bahwa pada hari ke-35 persediaan tepat 120 kg (tidak kurang dari batas). Kredit Sebagian (1): Menjawab hari 36 tanpa penjelasan logis." }
                ]
            },
            {
                unit: 4, title: "Suhu Udara di Jalur Pendakian", context: "Ilmiah",
                stimulus: "Sebuah kelompok pencinta alam mendaki sebuah bukit di Kalimantan Barat. Pos istirahat dipasang setiap kenaikan 100 m dari kaki bukit, sehingga pos 1 berada pada ketinggian 100 m, pos 2 pada 200 m, dan seterusnya sampai pos 12. Termometer di kaki bukit (ketinggian 0 m) menunjukkan 31,0 °C. Menurut data stasiun cuaca, suhu udara turun sekitar 0,6 °C untuk setiap kenaikan 100 m. Anggota kelompok membawa jaket tipis yang perlu dipakai jika suhu kurang dari 25 °C.",

                    { id: '4a', type: 'isian', text: "Berapa suhu udara di pos 8?", maxScore: 1, key: "26.2", rubric: "Jawaban 26.2 atau 26,2." },
                    { id: '4b', type: 'uraian', text: "Mulai pos ke berapa jaket tipis perlu dipakai? Jelaskan mengapa pos 10 belum termasuk.", maxScore: 3, key: "Pos 11", rubric: "Kredit Penuh (3): Model benar (31 - 0.6n < 25), mendapat Pos 11, dan menjelaskan pos 10 tepat 25 derajat. Kredit Sebagian (2): Pos benar tapi tanpa penjelasan batas pos 10. Kredit Sebagian (1): Hanya model benar." }
                ]
            },
            {
                unit: 5, title: "Rencana Latihan Lari Sinta", context: "Pribadi",
                stimulus: "Sinta menggunakan aplikasi kebugaran untuk menyiapkan lomba lari. Pada hari pertama ia menempuh 1,2 km, dan rencana latihan menambah jarak 0,3 km setiap hari dibandingkan hari sebelumnya. Dokter olahraga menyarankan agar jarak latihan harian tidak lebih dari 8 km.",
                questions: [
                    { id: '5a', type: 'isian', text: "Berapa km jarak latihan Sinta pada hari ke-10?", maxScore: 1, key: "3.9", rubric: "Jawaban 3.9 atau 3,9." },
                    { id: '5b', type: 'uraian', text: "Aplikasi memprediksi jarak hari ke-30 adalah 9,9 km. Periksa kebenaran hitungan aplikasi, lalu nilai apakah prediksi itu dapat diikuti Sinta.", maxScore: 2, key: "Hitungan benar, tapi melanggar saran.", rubric: "Kredit Penuh (2): Membuktikan hitungan 9.9 km benar secara matematis, namun menyimpulkan tidak bisa diikuti karena > 8 km." },
                    { id: '5c', type: 'isian', text: "Pada hari ke berapa jarak latihan terjauh yang masih sesuai saran dokter?", maxScore: 1, key: "23", rubric: "Jawaban Hari ke-23." }

            },
            {
                unit: 6, title: "Produksi Minuman Lidah Buaya", context: "Pekerjaan",
                stimulus: "Sebuah usaha kecil di Pontianak memproduksi minuman lidah buaya. Pada pekan promosi, jumlah botol yang diproduksi bertambah dengan banyak yang sama setiap hari. Pada hari ke-3 diproduksi 450 botol dan pada hari ke-8 diproduksi 700 botol. Mesin pengisi botol berkapasitas maksimum 1.000 botol per hari.",
                questions: [
                    { id: '6a', type: 'uraian', text: "Berapa botol produksi hari pertama, dan berapa tambahan produksi setiap hari?", maxScore: 2, key: "Awal 350, Tambahan 50", rubric: "Kredit Penuh (2): Menemukan a = 350 dan b = 50. Kredit Sebagian (1): Hanya a atau b yang benar." },
                    { id: '6b', type: 'isian', text: "Berapa botol yang akan diproduksi pada hari ke-15 jika pola berlanjut?", maxScore: 1, key: "1050", rubric: "Jawaban 1050." },
                    { id: '6c', type: 'uraian', text: "Mulai hari ke berapa produksi melampaui kapasitas mesin? Apa saran kamu kepada pemilik?", maxScore: 1, key: "Hari ke-15", rubric: "Kredit Penuh (1): Menyebut hari ke-15 dan memberikan saran logis (tambah shift/mesin atau hentikan penambahan)." }
                ]
            },
            {
                unit: 7, title: "Segitiga dari Batang Korek Api", image: "https://raw.githubusercontent.com/Rino-Sinus-Pandanu/Solva-PISA/main/Nomor%207.png", context: "Pribadi",
                stimulus: "Dalam sebuah lomba kreativitas, peserta menyusun batang korek api membentuk deretan segitiga sama sisi yang saling bersambung seperti pada gambar di bawah ini. Pola ke-1 terdiri atas 1 segitiga (3 batang), pola ke-2 terdiri atas 2 segitiga (5 batang), pola ke-3 terdiri atas 3 segitiga (7 batang), dan seterusnya.",
                questions: [
                    { id: '7a', type: 'uraian', text: "Tuliskan rumus banyak batang korek api pola ke-n, dan hitung batang untuk pola ke-25.", maxScore: 1, key: "U_n = 2n + 1. U_25 = 51", rubric: "Kredit Penuh (1): Rumus dan hasil 51 benar." },
                    { id: '7b', type: 'pgs', text: "Seorang peserta mengira pola ke-25 butuh 25x3=75 batang. Manakah penjelasan kekeliruannya?", options: ["A. Pola ke-25 tidak terdiri atas 25 segitiga.", "B. Segitiga bersambung berbagi sisi, segitiga baru hanya menambah 2 batang.", "C. Setiap segitiga butuh 4 batang.", "D. Batang tidak boleh dipakai bersama."], maxScore: 1, key: "B" },
                    { id: '7c', type: 'uraian', text: "Peserta punya 200 batang. Pola ke berapa paling besar yang dapat disusun, dan berapa sisanya?", maxScore: 2, key: "Pola 99, sisa 1", rubric: "Kredit Penuh (2): Menemukan Pola ke-99 dan sisa 1 batang. Kredit Sebagian (1): Hanya pola 99 benar tanpa sisa." }
                ]

            {
                unit: 8, title: "Jadwal Kapal Penyeberangan", context: "Masyarakat",
                stimulus: "Sebuah kapal motor penyeberangan di dermaga sungai berangkat pertama kali pukul 06.00. Setelah itu kapal berangkat setiap 45 menit sekali. Keberangkatan terakhir adalah keberangkatan paling akhir yang jatuh pada atau sebelum pukul 20.00.",
                questions: [
                    { id: '8a', type: 'isian', text: "Pukul berapa kapal melakukan keberangkatan ke-9?", maxScore: 1, key: "12.00", rubric: "Jawaban 12.00." },
                    { id: '8b', type: 'uraian', text: "Keberangkatan ke berapa dan pukul berapa yang menjadi keberangkatan terakhir?", maxScore: 2, key: "Ke-19, Pukul 19.30", rubric: "Kredit Penuh (2): Ke-19 dan 19.30 benar. Kredit Sebagian (1): Hanya satu elemen yang benar." },
                    { id: '8c', type: 'uraian', text: "Bu Sari tiba pukul 19.50. Apakah ia masih dapat menyeberang dengan jadwal hari itu? Jelaskan.", maxScore: 1, key: "Tidak dapat", rubric: "Kredit Penuh (1): Tidak dapat karena kapal terakhir sudah berangkat pukul 19.30." }
                ]
            },
            {
                unit: 9, title: "Tumpukan Gelas di Kedai", context: "Pekerjaan",
                stimulus: "Pemilik sebuah kedai minuman menumpuk gelas plastik. Satu gelas setinggi 10 cm. Setiap gelas tambahan yang dimasukkan ke dalam tumpukan menambah tinggi tumpukan sebesar 1,5 cm. Rak penyimpanan memiliki tinggi bebas 40 cm.",
                questions: [
                    { id: '9a', type: 'isian', text: "Berapa cm tinggi tumpukan 9 gelas?", maxScore: 1, key: "22", rubric: "Jawaban 22." },
                    { id: '9b', type: 'uraian', text: "Berapa banyak gelas paling banyak yang dapat ditumpuk agar tidak menyentuh rak atas?", maxScore: 3, key: "20 gelas", rubric: "Kredit Penuh (3): Model benar (10 + (n-1)1.5 < 40), n=20. Kredit Sebagian (2): Salah membulatkan menjadi 21 (menyentuh batas). Kredit Sebagian (1): Hanya model yang benar." }
                ]

            {
                unit: 10, title: "Kupon Undian Bazar", context: "Masyarakat",
                stimulus: "Panitia bazar sekolah mencetak kupon undian bernomor berurutan. Hadiah utama diberikan kepada pemegang kupon yang nomornya termasuk dalam barisan 5, 12, 19, 26, ... Tiga siswa memegang kupon bernomor: Andi 887, Budi 1.234, dan Citra 2.021.",
                questions: [
                    { id: '10a_1', type: 'pgs', text: "Apakah kupon Andi (887) menang?", options: ["Benar", "Salah"], maxScore: 1, key: "Benar" },
                    { id: '10a_2', type: 'pgs', text: "Apakah kupon Budi (1.234) menang?", options: ["Benar", "Salah"], maxScore: 1, key: "Salah" },
                    { id: '10a_3', type: 'pgs', text: "Apakah kupon Citra (2.021) menang?", options: ["Benar", "Salah"], maxScore: 1, key: "Benar" },

                ]
            },
            {
                unit: 11, title: "Lembar Kerja Tarif Parkir", image: "https://raw.githubusercontent.com/Rino-Sinus-Pandanu/Solva-PISA/main/Nomor%2011.png", context: "Pekerjaan",
                stimulus: "Pengelola sebuah pusat perbelanjaan di Pontianak menghitung tarif parkir progresif dengan lembar kerja (spreadsheet). Tarif parkir pada jam pertama adalah Rp3.000. Sel B3 berisi rumus =B2+1500, dan rumus tersebut disalin ke sel-sel di bawahnya sehingga setiap sel menghitung tarif jam berikutnya dari sel di atasnya. Tampilan sebagian lembar kerja ditunjukkan pada tabel di bawah ini.",

                    { id: '11a', type: 'isian', text: "Berapa rupiah nilai yang tampil pada sel B6 (Jam ke-5)?", maxScore: 1, key: "9000", rubric: "Jawaban 9000." },
                    { id: '11b', type: 'uraian', text: "Tuliskan rumus tarif jam ke-n secara eksplisit, lalu tentukan tarif jam ke-10.", maxScore: 1, key: "16500", rubric: "Kredit Penuh (1): Rumus (1500n+1500) dan hasil 16500 benar." },
                    { id: '11c', type: 'uraian', text: "Batas tarif Rp12.000. Pada jam ke berapa tarif pertama melebihi batas itu? Mengapa jam 7 belum?", maxScore: 1, key: "Jam ke-8", rubric: "Kredit Penuh (1): Jam ke-8, karena jam 7 tepat 12000 (tidak lebih besar)." },
                    { id: '11d', type: 'pgs', text: "Fungsi mana yang membatasi nilai maksimal menjadi 12000 pada sel B10?", options: ["A. =B9+1500", "B. =MIN(B9+1500; 12000)", "C. =MAX(B9+1500; 12000)", "D. =12000-B9"], maxScore: 1, key: "B" }
                ]
            },
            {
                unit: 12, title: "Tinggi Muka Air Sungai", image: "https://raw.githubusercontent.com/Rino-Sinus-Pandanu/Solva-PISA/main/Nomor%2012.png", context: "Ilmiah",
                stimulus: "Petugas pos pemantau di tepi Sungai Kapuas mencatat tinggi muka air setiap pagi selama musim kemarau. Grafik di bawah ini menunjukkan hasil pencatatan selama 6 hari pertama. Dermaga kayu hanya dapat dipakai kapal jika tinggi muka air tidak kurang dari 250 cm.",

const app=document.getElementById('app');
let stage='intro',currentUnit=0,answers={},scores={},visited=new Set(),reviewIndex=0;
const STORAGE_KEY='solva-pisa-progress-v1';
function saveProgress(){
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify({answers,scores,currentUnit,stage,visited:[...visited]}));}
  catch(error){console.warn('Progres tidak dapat disimpan di browser:',error);}
}
function loadProgress(){
  try{
    const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');
    if(!saved||typeof saved!=='object') return;
    if(saved.answers&&typeof saved.answers==='object') answers=saved.answers;
    if(saved.scores&&typeof saved.scores==='object') scores=saved.scores;
    if(Number.isInteger(saved.currentUnit)) currentUnit=Math.max(0,Math.min(quizData.length-1,saved.currentUnit));
    if(['intro','quiz','self-eval','result'].includes(saved.stage)) stage=saved.stage;
    if(Array.isArray(saved.visited)) visited=new Set(saved.visited.filter(n=>Number.isInteger(n)&&n>=0&&n<quizData.length));
  }catch(error){console.warn('Progres tersimpan tidak dapat dibaca:',error);}
}
loadProgress();
const allQuestions=()=>quizData.flatMap(unit=>unit.questions.map(q=>({unit,q})));
const maxTotal=()=>allQuestions().reduce((s,x)=>s+x.q.maxScore,0);
const answeredCount=()=>allQuestions().filter(({q})=>String(answers[q.id]||'').trim()!=='').length;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function normalize(s){
  let value=String(s??'').toLowerCase().trim().replace(/rp\.?/g,'').replace(/\s/g,'');
  // Remove common thousand separators only when followed by exactly three digits at the end
  // or before a non-digit; then standardize decimal commas.
  value=value.replace(/[.,](?=\d{3}(\D|$))/g,'');
  value=value.replace(/,/g,'.');
  return value.replace(/[^a-z0-9.-]/g,'');
}
function objectiveMatch(q,answer){
  if(!String(answer??'').trim()) return false;
  const raw=String(answer).trim();
  if(q.type==='pgs'){
    const a=raw.toUpperCase();
    const key=String(q.key).trim().toUpperCase();
    return a===key || a===key+'.' || a.startsWith(key+'. ');
  }
  const a=normalize(raw), k=normalize(q.key);
  if(a===k) return true;
  const aliases=String(q.key).split(/[;|]/).map(normalize);
  return aliases.includes(a);
}
function startQuiz(){stage='quiz';saveProgress();render()}
function setAnswer(id,value){answers[id]=value;saveProgress();}
function goUnit(n){currentUnit=Math.max(0,Math.min(quizData.length-1,n));visited.add(currentUnit);saveProgress();render()}
function submitQuiz(){allQuestions().forEach(({q})=>{if(q.type!=='uraian')scores[q.id]=objectiveMatch(q,answers[q.id])?q.maxScore:0;else scores[q.id]=0});stage='self-eval';reviewIndex=0;saveProgress();render();window.scrollTo(0,0)}
function setScore(id,s){scores[id]=s;saveProgress();render()}
function finishEval(){stage='result';saveProgress();render();window.scrollTo(0,0)}
function totalScore(){return Object.values(scores).reduce((a,b)=>a+(Number(b)||0),0)}
function headerProgress(){let n=answeredCount(),all=allQuestions().length;return `<div class="row-between tiny muted" style="margin:14px 0 7px"><span>Jawaban terisi</span><strong>${n}/${all}</strong></div><div class="progress"><div style="width:${n/all*100}%"></div></div>`}
function renderIntro(){app.innerHTML=`<section class="hero"><div class="eyebrow">Latihan literasi matematis</div><h1>Latihan Soal PISA-Like: Barisan Bilangan</h1><p>Pelajari penerapan barisan aritmetika dan geometri melalui berbagai permasalahan kontekstual.</p><div class="hero-grid"><div class="metric"><strong>24</strong><span>Unit soal</span></div><div class="metric"><strong>${allQuestions().length}</strong><span>Total pertanyaan</span></div><div class="metric"><strong>2</strong><span>Jenis barisan utama (aritmatika & geometri)</span></div></div><button class="btn btn-primary" onclick="startQuiz()">Mulai kuis <span aria-hidden="true">→</span></button></section><section class="intro-layout"><div class="panel"><h2 style="margin-top:0">Cara mengerjakan</h2><ul class="checklist"><li>Kerjakan unit secara berurutan atau pilih unit melalui navigasi.</li><li>Jawaban isian dan pilihan ganda diperiksa otomatis sebagai umpan balik awal.</li><li>Setelah semua unit, evaluasi mandiri menampilkan kunci dan rubrik untuk <b>seluruh pertanyaan</b>, bukan hanya uraian.</li><li>Untuk uraian, baca rubrik lalu tentukan kredit yang sesuai dengan pekerjaan Anda.</li></ul><div class="notice">Catatan akademik: aplikasi ini merupakan prototipe latihan PISA-Like, bukan tes resmi PISA dan belum menggantikan validasi ahli maupun uji coba empiris.</div></div><aside class="panel"><h3 style="margin-top:0">Yang akan dilatih</h3><p class="muted">Merumuskan situasi secara matematis (formulate), menerapkan strategi perhitungan (employ), serta menafsirkan dan mengevaluasi hasil berdasarkan konteks (interpret & evaluate).</p><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><p class="tiny muted">Sumber soal: Makalah “Pengembangan Soal PISA-Like pada Materi Barisan Bilangan oleh Rino Sinus Pandanu” dan data soal yang disertakan.</p></aside></section>`}
function renderQuiz(){let unit=quizData[currentUnit];visited.add(currentUnit);let done=unit.questions.filter(q=>String(answers[q.id]||'').trim()!=='').length;let qhtml=unit.questions.map(q=>`<section class="question"><div class="qmeta"><span>Pertanyaan ${esc(q.id)}</span><span>${q.maxScore} poin</span></div><h3>${esc(q.text)}</h3>${q.type==='isian'?`<input class="field" aria-label="Jawaban ${esc(q.id)}" placeholder="Ketik jawaban singkat..." value="${esc(answers[q.id]||'')}" oninput="setAnswer('${q.id}',this.value)">`:q.type==='uraian'?`<textarea class="field textarea" aria-label="Uraian ${esc(q.id)}" placeholder="Tuliskan model, langkah perhitungan, dan alasan Anda..." oninput="setAnswer('${q.id}',this.value)">${esc(answers[q.id]||'')}</textarea>`:(q.options||[]).map((opt,i)=>{let val=(opt==='Benar'||opt==='Salah')?opt:String(opt).charAt(0);return `<label class="option"><input type="radio" name="${esc(q.id)}" value="${esc(val)}" ${answers[q.id]===val?'checked':''} onchange="setAnswer('${q.id}',this.value)"><span>${esc(opt)}</span></label>`}).join('')}</section>`).join('');app.innerHTML=`<div class="app-layout"><aside class="panel sidebar"><div class="side-title">Navigasi unit</div><div class="unit-list">${quizData.map((u,i)=>`<button class="unit-btn ${i===currentUnit?'active':''} ${u.questions.every(q=>String(answers[q.id]||'').trim()!=='')?'done':''}" onclick="goUnit(${i})" aria-label="Unit ${i+1}">${i+1}</button>`).join('')}</div>${headerProgress()}<p class="tiny muted">${visited.size} dari 24 unit dibuka</p><button class="btn btn-light" style="width:100%;margin-top:12px" onclick="if(confirm('Kembali ke halaman awal? Jawaban saat ini tetap tersimpan selama halaman tidak dimuat ulang.')){stage='intro';render()}">Keluar ke beranda</button></aside><section><div class="panel"><div class="row-between"><span class="pill gold">UNIT ${unit.unit} / ${quizData.length}</span><span class="pill">Konteks: ${esc(unit.context)}</span></div><h1 style="font-size:clamp(25px,4vw,34px);line-height:1.2;margin:16px 0 0">${esc(unit.title)}</h1><div class="stimulus"><div class="eyebrow" style="color:#8a5a00">Situasi</div><p style="margin:8px 0 0">${esc(unit.stimulus)}</p>${unit.image?`<figure style="margin:16px 0 0"><img src="${unit.image}" alt="Gambar pendukung soal Unit ${unit.unit}" loading="lazy" style="display:block;width:100%;max-width:850px;height:auto;margin:0 auto;border:1px solid var(--line);border-radius:10px;background:white"><figcaption class="tiny muted" style="text-align:center;margin-top:6px">Gambar pendukung soal</figcaption></figure>`:""}</div><div class="row-between"><h2 style="font-size:18px;margin:0">Tantangan Anda</h2><span class="tiny muted">${done}/${unit.questions.length} terisi pada unit ini</span></div>${qhtml}<div class="actions"><button class="btn btn-light" ${currentUnit===0?'disabled':''} onclick="goUnit(${currentUnit-1})">← Unit sebelumnya</button><span class="tiny muted">Unit ${currentUnit+1} dari 24</span>${currentUnit<quizData.length-1?`<button class="btn btn-dark" onclick="goUnit(${currentUnit+1})">Unit berikutnya →</button>`:`<button class="btn btn-primary" onclick="if(confirm('Kirim jawaban dan masuk ke evaluasi mandiri? Pastikan pekerjaan Anda sudah selesai.'))submitQuiz()">Kirim jawaban & evaluasi →</button>`}</div>${currentUnit===quizData.length-1?`<p class="tiny muted">Setelah dikirim, Anda akan masuk ke evaluasi mandiri yang mencakup seluruh pertanyaan dari Unit 1 sampai Unit 24.</p>`:''}</div></section></div>`}
function renderEval(){let items=allQuestions();let scored=items.filter(({q})=>scores[q.id]!==undefined).length;app.innerHTML=`<section class="hero" style="padding:30px;margin-bottom:22px"><div class="eyebrow">Tahap refleksi</div><h1 style="font-size:clamp(27px,4vw,38px);margin:10px 0">Evaluasi mandiri menyeluruh</h1><p>Semua pertanyaan ditampilkan berurutan, termasuk isian, pilihan ganda, dan uraian. Cocokkan jawaban dengan kunci serta rubrik. Skor otomatis untuk soal objektif adalah saran awal dan dapat Anda sesuaikan setelah meninjau jawaban.</p><div class="row-between tiny"><span>${scored} dari ${items.length} pertanyaan memiliki skor awal</span><strong>${totalScore()} / ${maxTotal()} poin saat ini</strong></div><div class="progress" style="margin-top:8px"><div style="width:${scored/items.length*100}%"></div></div></section><div class="notice" style="margin-bottom:18px"><b>Penting:</b> penilaian mandiri bukan penilaian eksternal. Untuk penggunaan penelitian, hasil perlu ditinjau guru/penilai dan instrumen perlu divalidasi. Rubrik yang tersedia dalam data sumber ditampilkan apa adanya.</div>${items.map(({unit,q},i)=>{let score=scores[q.id]??0;let auto=q.type!=='uraian';return `<section class="eval-card"><div class="qmeta"><span>Unit ${unit.unit} · ${esc(unit.title)} · ${esc(q.id)}</span><span>Maks. ${q.maxScore} poin</span></div><h3 style="font-size:16px;margin:12px 0">${esc(q.text)}</h3><div class="eval-grid"><div class="answer-box"><b>Jawaban Anda</b><p style="margin-bottom:0">${esc(answers[q.id]||'(Belum diisi)')}</p></div><div class="key-box"><b>Kunci jawaban</b><p style="margin-bottom:0">${esc(q.key||'Tidak tersedia dalam data soal')}</p>${q.rubric?`<p class="tiny" style="border-top:1px solid #b7eee0;padding-top:9px;margin-bottom:0"><b>Rubrik:</b> ${esc(q.rubric)}</p>`:''}</div></div>${auto?`<div class="tiny muted">Skor awal otomatis: ${score}/${q.maxScore}. Periksa kembali format dan satuan jawaban sebelum menetapkan skor akhir.</div>`:''}<div class="score-row"><div><b>Skor mandiri</b><div class="tiny muted">Pilih kredit sesuai kecocokan jawaban dengan kunci/rubrik.</div></div><div class="score-buttons">${Array.from({length:q.maxScore+1},(_,s)=>`<button class="score-btn ${Number(score)===s?'selected':''}" onclick="setScore('${q.id}',${s})" aria-label="Skor ${s} untuk ${esc(q.id)}">${s}</button>`).join('')}</div></div></section>`}).join('')}<div class="panel"><div class="row-between"><div><h2 style="margin:0">Selesaikan evaluasi</h2><p class="tiny muted">Skor yang dipilih akan diringkas pada halaman hasil.</p></div><button class="btn btn-primary" onclick="finishEval()">Lihat hasil akhir →</button></div></div>`}
function renderResult(){let total=totalScore(),max=maxTotal(),pct=Math.round(total/max*100),cat=pct>=85?'Sangat baik':pct>=70?'Baik':pct>=55?'Cukup':pct>=40?'Perlu penguatan':'Perlu pendampingan';let objective=allQuestions().filter(({q})=>q.type!=='uraian').length,essays=allQuestions().length-objective;app.innerHTML=`<section class="panel" style="max-width:850px;margin:20px auto;padding:clamp(24px,5vw,48px)"><div class="eyebrow">Laporan hasil kuis</div><h1 style="font-size:clamp(28px,4vw,40px);line-height:1.15;margin:12px 0">Evaluasi Literasi Matematis</h1><p class="muted">Kuis PISA-Like · Barisan Aritmetika dan Geometri</p><div style="display:flex;align-items:baseline;gap:12px;margin:30px 0 16px"><span class="result-score">${total}</span><span class="muted" style="font-size:25px">/ ${max} poin</span></div><div class="progress" style="height:12px"><div style="width:${pct}%"></div></div><div class="row-between" style="margin-top:9px"><span class="tiny muted">Persentase skor</span><b>${pct}%</b></div><div class="result-grid"><div class="result-stat"><span class="tiny muted">Kategori deskriptif</span><strong>${cat}</strong></div><div class="result-stat"><span class="tiny muted">Unit soal</span><strong>24</strong></div><div class="result-stat"><span class="tiny muted">Pertanyaan</span><strong>${allQuestions().length}</strong></div></div><div class="notice">Kategori di atas merupakan ringkasan deskriptif aplikasi, bukan level kemahiran PISA yang terkalibrasi. Skor memuat penilaian mandiri untuk uraian dan perlu ditafsirkan secara hati-hati.</div><h3>Ringkasan</h3><p class="muted">Soal objektif yang dinilai otomatis: ${objective}. Soal uraian yang membutuhkan pertimbangan rubrik: ${essays}. Kunci jawaban ditampilkan untuk mendukung refleksi, bukan sebagai bukti validitas instrumen.</p><div class="actions"><button class="btn btn-light" onclick="stage='self-eval';render();window.scrollTo(0,0)">← Kembali ke evaluasi</button><button class="btn btn-dark" onclick="if(confirm('Mulai ulang kuis? Semua jawaban dan skor akan dihapus.')){answers={};scores={};visited=new Set();currentUnit=0;stage='intro';try{localStorage.removeItem(STORAGE_KEY)}catch(error){}render();window.scrollTo(0,0)}">Ulangi dari awal ↻</button><button class="btn btn-primary" onclick="window.print()">Cetak hasil / PDF</button></div></section>`}
function typesetMath(){
  if(window.MathJax && window.MathJax.typesetPromise){
    window.MathJax.typesetPromise([app]).catch(function(error){console.warn('MathJax gagal memproses rumus:', error);});
  }
}
function render(){
  if(window.MathJax && window.MathJax.typesetClear) window.MathJax.typesetClear([app]);
  if(stage==='intro')renderIntro();
  else if(stage==='quiz')renderQuiz();
  else if(stage==='self-eval')renderEval();
  else renderResult();
  typesetMath();
}
render();
</script>
<script>
/* Pembatasan interaksi dasar: menonaktifkan menu klik kanan dan penyeretan gambar. */
document.addEventListener('contextmenu', function (event) {
  event.preventDefault();
});
document.addEventListener('dragstart', function (event) {
  if (event.target && event.target.tagName === 'IMG') event.preventDefault();
});
</script>
</body></html>
